name: Bug report
description: Report a skill, packaging, installation, or compatibility problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result. Do not include credentials, private screen content, or session files.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App, plugin, AI client, and operating system versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and sanitized error
