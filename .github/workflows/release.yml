name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main source
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
  verify:
    needs: source
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-linux-x64
          path: dist
      - name: Verify artifacts and release version
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          cd ..
          python - <<'PY'
          import json, re
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)',version)
          assert json.loads(Path('dist/release.json').read_text())['version']==version
          PY
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft from the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "Lassu skills $version" --notes-file docs/RELEASE_NOTES.md --draft
