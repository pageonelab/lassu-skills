name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: macos-arm64}
          - {runner: macos-15-intel, platform: macos-x64}
          - {runner: windows-2025, platform: windows-x64}
          - {runner: windows-11-arm, platform: windows-arm64}
          - {runner: ubuntu-24.04, platform: linux-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python scripts/package.py check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  gate:
    name: CI gate
    if: always()
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform
        env:
          RESULT: ${{ needs.package.result }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$RESULT" = success
          if [[ "$EVENT" == pull_request && "$BASE" == main ]]; then
            test "$HEAD" = dev
            test "$HEAD_REPO" = "$REPOSITORY"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: packages
      - name: Compare exact archive bytes across platforms
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=sorted(Path('packages').iterdir())
          assert len(roots)==5, 'Every platform must upload artifacts'
          reference={p.name:p.read_bytes() for p in roots[0].iterdir()}
          for root in roots[1:]:
              assert {p.name:p.read_bytes() for p in root.iterdir()}==reference, f'Non-reproducible artifact: {root}'
          PY
